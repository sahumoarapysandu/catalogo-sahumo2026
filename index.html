<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahumo ArapySandú · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-900:#152318;
    --verde-800:#1e3626;
    --verde-700:#2b4d36;
    --oro:#c9a227;
    --oro-claro:#e8cf7a;
    --crema:#f6f0e2;
    --crema-2:#efe6d0;
    --tinta:#20241c;
    --tinta-suave:#5b5646;
    --terracota:#a85c32;
    --line:rgba(32,36,28,0.12);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--crema);
    color:var(--tinta);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    background:radial-gradient(120% 140% at 20% 0%, #24402c 0%, var(--verde-900) 60%, #0f1a11 100%);
    color:var(--crema);
    padding:64px 24px 48px;
    overflow:hidden;
    text-align:center;
  }
  .smoke{
    position:absolute; inset:0; pointer-events:none; opacity:.35; mix-blend-mode:screen;
  }
  .smoke svg{width:100%;height:100%;}
  .eyebrow{
    text-transform:uppercase; letter-spacing:.28em; font-size:11px; color:var(--oro-claro);
    font-weight:700; position:relative; z-index:2;
  }
  .hero-logo{
    display:block; width:clamp(150px,34vw,210px); height:auto; aspect-ratio:1/1;
    margin:0 auto 4px; border-radius:50%; background:#fff;
    border:3px solid var(--oro); box-shadow:0 0 0 6px rgba(201,162,39,.18), 0 14px 34px -12px rgba(0,0,0,.6);
    position:relative; z-index:2;
  }
  .hero h1{
    font-size:clamp(40px,7vw,64px); margin:14px 0 6px; position:relative; z-index:2;
  }
  .hero .sub{
    font-size:15px; color:#d9d2bd; position:relative; z-index:2; margin-bottom:22px;
  }
  .rule{
    width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);
    margin:20px auto; position:relative; z-index:2;
  }
  .contacto-hero{
    display:flex; gap:22px; justify-content:center; flex-wrap:wrap; position:relative; z-index:2;
    font-size:13px; color:#cfc7ad;
  }
  .contacto-hero b{color:var(--oro-claro); font-weight:700;}

  /* ---------- NAV CATEGORIAS ---------- */
  .catnav{
    position:sticky; top:0; z-index:40;
    background:rgba(246,240,226,0.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:12px 16px;
  }
  .catnav button{
    flex:0 0 auto; border:1px solid rgba(32,36,28,0.22); background:#fff;
    color:var(--tinta); padding:10px 16px; border-radius:6px; font-family:'Manrope';
    font-size:13px; font-weight:700; cursor:pointer; transition:background .2s, color .2s, border-color .2s;
    white-space:nowrap; box-shadow:inset 0 -3px 0 var(--crema-2, #efe6d0);
  }
  .catnav button:hover{ border-color:var(--oro); box-shadow:inset 0 -3px 0 var(--oro); }
  .catnav button.active{
    background:var(--verde-800); color:var(--crema); border-color:var(--verde-800);
    box-shadow:inset 0 -3px 0 var(--oro);
  }
  .catnav button:focus-visible{ outline:2px solid var(--oro); outline-offset:2px; }
  /* "Productos" (ver todo) separado del resto con una línea dorada */
  .catnav button.cat-all{ position:relative; margin-right:10px; }
  .catnav button.cat-all::after{
    content:''; position:absolute; right:-10px; top:15%; bottom:15%; width:1px; background:var(--oro);
  }
  @media (max-width:480px){
    .catnav{ gap:6px; padding:10px 12px; }
    .catnav button{ padding:8px 11px; font-size:11.5px; }
    .catnav button.cat-all{ margin-right:0; }
    .catnav button.cat-all::after{ display:none; }
  }

  /* ---------- BUSCADOR ---------- */
  .searchbar{
    max-width:640px; margin:18px auto 0; padding:0 20px;
    display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .search-field{position:relative; width:100%;}
  .search-field input{
    padding:13px 16px; border-radius:11px; border:1px solid var(--line);
    font-family:'Manrope'; font-size:14.5px; background:#fff; color:var(--tinta); width:100%;
  }
  .search-field input:focus{outline:none; border-color:var(--oro);}
  .suggestions{
    position:absolute; top:100%; left:0; right:0; margin-top:4px;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 14px 28px -16px rgba(30,54,38,.35); max-height:280px; overflow-y:auto;
    z-index:50; display:none;
  }
  .suggestions.show{display:block;}
  .suggestions div{
    padding:10px 14px; font-size:13.5px; cursor:pointer; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .suggestions div:last-child{border-bottom:none;}
  .suggestions div:hover{background:var(--crema-2);}
  .suggestions .no-match{color:var(--tinta-suave); cursor:default; justify-content:center;}
  .suggestions .tag{
    font-size:10px; text-transform:uppercase; letter-spacing:.06em; font-weight:800;
    color:var(--oro); background:var(--crema-2); padding:2px 8px; border-radius:100px; flex:0 0 auto;
  }
  .clear-btn{
    margin-top:0; border:1px solid var(--line); background:transparent; color:var(--terracota);
    padding:7px 16px; border-radius:100px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .clear-btn:hover{background:var(--terracota); color:#fff; border-color:var(--terracota);}

  /* ---------- CATALOGO ---------- */
  .wrap{max-width:1180px; margin:0 auto; padding:8px 20px 120px;}
  .cat-section{padding-top:38px;}
  .cat-title{
    display:flex; align-items:baseline; gap:14px; margin-bottom:4px;
  }
  .cat-title .num{color:var(--oro); font-size:13px; font-weight:700; letter-spacing:.1em;}
  .cat-title h2{font-size:26px; margin:0;}
  .cat-count{color:var(--tinta-suave); font-size:13px; margin-bottom:18px;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden;
    display:flex; flex-direction:column; transition:transform .18s, box-shadow .18s;
  }
  .card:hover{transform:translateY(-3px); box-shadow:0 14px 28px -16px rgba(30,54,38,.35);}
  .card .imgwrap{aspect-ratio:1/1; background:var(--crema-2); overflow:hidden;}
  .card img{width:100%;height:100%;object-fit:cover; display:block;}
  .card .info{padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card .marca{
    text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; font-weight:800;
    color:var(--oro); margin-bottom:-3px;
  }
  .card .name{font-size:13.5px; font-weight:600; line-height:1.3; min-height:34px;}
  .card .price{font-family:'Fraunces'; font-weight:700; font-size:18px; color:var(--verde-800);}
  .card .aroma-select{
    width:100%; padding:7px 8px; border-radius:8px; border:1px solid var(--line);
    font-family:'Manrope'; font-size:12px; background:var(--crema); color:var(--tinta);
  }
  .ci-aroma{font-size:11.5px; color:var(--oro); font-weight:700; margin-top:1px;}
  .detail-toggle{font-size:12px;}
  .detail-toggle summary{
    cursor:pointer; color:var(--verde-800); font-weight:700; list-style:none; user-select:none;
  }
  .detail-toggle summary::-webkit-details-marker{display:none;}
  .detail-toggle summary::before{content:"ⓘ "; }
  .detail-toggle[open] summary::before{content:"▾ ";}
  .detail-toggle p{
    margin:6px 0 0; color:var(--tinta-suave); font-size:12px; line-height:1.4;
  }
  .card .addbtn{
    margin-top:auto; border:none; background:var(--verde-800); color:var(--crema);
    padding:9px; border-radius:9px; font-weight:700; font-size:12.5px; cursor:pointer;
    transition:.15s; font-family:'Manrope';
  }
  .card .addbtn:hover{background:var(--oro); color:var(--tinta);}
  .card .addbtn.added{background:var(--oro);color:var(--tinta);}

  /* ---------- CARRITO FLOTANTE ---------- */
  .cart-fab{
    position:fixed; right:20px; bottom:20px; z-index:60;
    background:var(--verde-900); color:var(--crema); border:none;
    width:60px; height:60px; border-radius:50%; cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .cart-fab .badge{
    position:absolute; top:-4px; right:-4px; background:var(--oro); color:var(--tinta);
    font-size:11px; font-weight:800; border-radius:50%; min-width:20px;height:20px;
    display:flex; align-items:center; justify-content:center; padding:0 4px;
  }
  .cart-drawer{
    position:fixed; top:0; right:0; height:100%; width:min(400px,100%);
    background:var(--crema); z-index:70; box-shadow:-20px 0 40px rgba(0,0,0,.25);
    transform:translateX(100%); transition:transform .3s ease; display:flex; flex-direction:column;
  }
  .cart-drawer.open{transform:translateX(0);}
  .cart-head{
    background:var(--verde-900); color:var(--crema); padding:20px; display:flex;
    justify-content:space-between; align-items:center;
  }
  .cart-head h3{margin:0; font-size:20px;}
  .cart-head button{background:none;border:none;color:var(--crema);font-size:22px;cursor:pointer;}
  .cart-items{flex:1; overflow-y:auto; padding:14px 18px;}
  .cart-empty{color:var(--tinta-suave); text-align:center; margin-top:60px; font-size:14px;}
  .cart-item{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line);}
  .cart-item img{width:56px;height:56px;border-radius:8px;object-fit:cover;}
  .cart-item .ci-info{flex:1;}
  .cart-item .ci-name{font-size:13px; font-weight:600;}
  .cart-item .ci-price{font-size:12px; color:var(--tinta-suave); margin-top:2px;}
  .qty{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .qty button{
    width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;
    font-weight:700;
  }
  .qty span{font-size:13px; font-weight:700; min-width:16px; text-align:center;}
  .remove-btn{background:none;border:none;color:var(--terracota);font-size:11px;cursor:pointer;text-decoration:underline; margin-top:4px;}
  .cart-foot{padding:18px; border-top:1px solid var(--line); background:#fff;}
  .cart-total{display:flex; justify-content:space-between; font-family:'Fraunces'; font-size:20px; font-weight:700; margin-bottom:14px;}
  .checkout-btn{
    width:100%; padding:14px; border:none; border-radius:10px; background:var(--oro);
    color:var(--tinta); font-weight:800; font-size:14.5px; cursor:pointer; font-family:'Manrope';
  }
  .checkout-btn:hover{background:var(--oro-claro);}
  .checkout-btn:disabled{opacity:.4; cursor:not-allowed;}
  .overlay{position:fixed; inset:0; background:rgba(20,24,18,.4); z-index:65; opacity:0; pointer-events:none; transition:.25s;}
  .overlay.show{opacity:1; pointer-events:auto;}

  /* ---------- MODAL CHECKOUT ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,24,18,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--crema);border-radius:16px;max-width:420px;width:100%;padding:26px;}
  .modal h3{margin-top:0;}
  .modal label{display:block;font-size:12.5px;font-weight:700;margin:14px 0 6px;color:var(--tinta-suave);}
  .modal input, .modal select{
    width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);font-family:'Manrope';font-size:14px;
  }
  .modal .close-x{position:absolute; top:14px; right:16px; background:none;border:none;font-size:20px;cursor:pointer;}

  /* ---------- MODAL DETALLE DE PRODUCTO ---------- */
  .detail-btn{
    background:none; border:none; padding:0; margin-top:-2px;
    color:var(--verde-800); font-weight:700; font-size:12px; cursor:pointer;
    text-align:left; display:flex; align-items:center; gap:4px; font-family:'Manrope';
  }
  .detail-btn:hover{color:var(--oro);}
  .detail-btn::before{content:"ⓘ"; font-size:12px;}
  .detail-modal{
    background:var(--crema); border-radius:18px; max-width:600px; width:100%;
    max-height:88vh; overflow-y:auto; position:relative;
  }
  .detail-modal .close-x{
    position:absolute; top:14px; right:14px; z-index:2;
    background:rgba(21,35,24,.55); color:#fff; width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:17px; border:none; cursor:pointer;
  }
  .detail-modal .close-x:hover{background:var(--verde-900);}
  .detail-img{
    width:100%; aspect-ratio:4/3; background:var(--crema-2); overflow:hidden;
    border-radius:18px 18px 0 0;
  }
  .detail-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .detail-body{padding:22px 24px 26px;}
  .detail-body .marca{
    text-transform:uppercase; letter-spacing:.1em; font-size:11.5px; font-weight:800; color:var(--oro);
  }
  .detail-body h3{margin:6px 0 4px; font-size:22px; line-height:1.25;}
  .detail-body .price{
    font-family:'Fraunces'; font-weight:700; font-size:21px; color:var(--verde-800); margin-bottom:14px;
  }
  .detail-body .desc{
    color:var(--tinta-suave); font-size:14px; line-height:1.65; padding-top:14px;
    border-top:1px solid var(--line);
  }
  .detail-body .desc br{content:""; display:block; margin-top:8px;}
  .detail-aromas{display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 2px;}
  .detail-aromas span{
    background:var(--crema-2); color:var(--tinta); font-size:11.5px; font-weight:700;
    padding:5px 12px; border-radius:100px;
  }
  .detail-body .addbtn{
    margin-top:20px; width:100%; border:none; background:var(--verde-800); color:var(--crema);
    padding:13px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
    transition:.15s; font-family:'Manrope';
  }
  .detail-body .addbtn:hover{background:var(--oro); color:var(--tinta);}
  @media (max-width:520px){
    .detail-modal{max-height:92vh;}
    .detail-body{padding:18px 18px 22px;}
  }
  .modal-wrap{position:relative;}
  .send-btn{
    margin-top:20px;width:100%;padding:13px;border:none;border-radius:10px;background:#25D366;color:#fff;
    font-weight:800;font-size:14.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  footer{
    background:var(--verde-900); color:#cfc7ad; text-align:center; padding:30px 20px; font-size:12.5px;
  }
  footer b{color:var(--oro-claro);}
</style>
</head>

function formatDetail(text){
  // Cada "punto seguido" (punto + espacio) pasa a la línea de abajo
  return (text || '').trim().replace(/\.\s+/g, '.<br>');
}

// build category nav + sections
const categories = [...new Set(PRODUCTS.map(p=>p.category))];
const catnav = document.getElementById('catnav');
const catalog = document.getElementById('catalog');

// Botón "Productos" para volver a ver el catálogo completo
const allBtn = document.createElement('button');
allBtn.textContent = 'Productos';
allBtn.className = 'cat-all';
allBtn.dataset.cat = '';
allBtn.classList.add('active');
allBtn.onclick = ()=>{ setActiveCategory(null); };
catnav.appendChild(allBtn);

function showCategory(cat){
  // Marca el botón activo
  [...catnav.children].forEach(b=>{
    b.classList.toggle('active', b.dataset.cat === (cat || ''));
  });
  // Muestra solo la sección elegida (o todas si cat es null)
  [...catalog.children].forEach(section=>{
    section.style.display = (!cat || section.dataset.category === cat) ? '' : 'none';
  });
}

function setActiveCategory(cat){
  currentCategory = cat;
  showCategory(cat);
  window.scrollTo({ top: catalog.offsetTop - 80, behavior: 'smooth' });
}

categories.forEach((cat,i)=>{
  const btn = document.createElement('button');
  btn.textContent = cat;
  btn.dataset.cat = cat;
  btn.onclick = ()=>{ setActiveCategory(cat); };
  catnav.appendChild(btn);

  const items = PRODUCTS.filter(p=>p.category===cat);
  const section = document.createElement('div');
  section.className='cat-section';
  section.id='sec-'+i;
  section.dataset.category = cat;
  section.innerHTML = `
    <div class="cat-title"><span class="num">${String(i+1).padStart(2,'0')}</span><h2>${cat}</h2></div>
    <div class="cat-count">${items.length} productos</div>
    <div class="grid">
      ${items.map(p=>`
        <div class="card" data-search="${normalize([p.brand, p.name, ...(p.aromas||[]).map(a=> typeof a === 'string' ? a : a.nombre)].join(' | '))}">
          <div class="imgwrap"><img src="${p.img}" loading="lazy" alt="${p.name}"></div>
          <div class="info">
            ${p.brand ? `<div class="marca">${p.brand}</div>` : ''}
            <div class="name">${p.name}</div>
            <div class="price">${money(p.price)}</div>
            ${p.detail ? `
              <button class="detail-btn" data-detail-id="${p.id}">Ver detalle</button>
            ` : ''}
            ${p.aromas.length ? `
              <select class="aroma-select">
                ${p.aromas.map(a=>{ const n = typeof a === 'string' ? a : a.nombre; return `<option value="${n}">${n}</option>`; }).join('')}
              </select>
            ` : ''}
            <button class="addbtn" data-id="${p.id}">Agregar</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  catalog.appendChild(section);
});

// ---------- BUSCADOR (marca / línea / aroma en un solo campo) ----------
function dedupeCaseInsensitive(arr){
  const map = new Map(); // clave normalizada -> primer texto visto (con su capitalización original)
  arr.forEach(v=>{
    const key = normalize(v);
    if(key && !map.has(key)) map.set(key, v);
  });
  return [...map.values()];
}
const searchIndex = [
  ...allBrandsList(),
  ...allNamesList(),
  ...allAromasList()
];
function allBrandsList(){
  return dedupeCaseInsensitive(PRODUCTS.map(p=>p.brand).filter(Boolean)).map(v=>({label:v, tag:'Marca'}));
}
function allNamesList(){
  return dedupeCaseInsensitive(PRODUCTS.map(p=>p.name).filter(Boolean)).map(v=>({label:v, tag:'Nombre'}));
}
function allAromasList(){
  return dedupeCaseInsensitive(PRODUCTS.flatMap(p=>(p.aromas||[]).map(a=> typeof a === 'string' ? a : a.nombre)))
    .filter(Boolean).map(v=>({label:v, tag:'Aroma'}));
}
searchIndex.sort((a,b)=>a.label.localeCompare(b.label,'es'));

let searchQuery = '';

function cardMatches(card){
  const q = normalize(searchQuery);
  return !q || card.dataset.search.includes(q);
}

function applyFilters(){
  const active = !!searchQuery.trim();
  document.getElementById('clearFilters').style.display = active ? 'inline-block' : 'none';

  if(active){
    // Con búsqueda activa se ignora la categoría elegida y se buscan coincidencias en todo el catálogo
    [...catnav.children].forEach(b=>b.classList.remove('active'));
    [...catalog.children].forEach(section=>{
      let visible = 0;
      section.querySelectorAll('.card').forEach(card=>{
        const match = cardMatches(card);
        card.style.display = match ? '' : 'none';
        if(match) visible++;
      });
      section.style.display = visible>0 ? '' : 'none';
      const countEl = section.querySelector('.cat-count');
      if(countEl) countEl.textContent = visible + (visible===1 ? ' producto' : ' productos');
    });
  } else {
    // Sin búsqueda: se restaura el conteo original y la vista por categoría
    [...catalog.children].forEach(section=>{
      section.querySelectorAll('.card').forEach(card=>{ card.style.display = ''; });
      const countEl = section.querySelector('.cat-count');
      const total = section.querySelectorAll('.card').length;
      if(countEl) countEl.textContent = total + (total===1 ? ' producto' : ' productos');
    });
    showCategory(currentCategory);
  }
}

const searchInput = document.getElementById('searchAll');
const searchSugg = document.getElementById('suggAll');

function renderSuggestions(){
  const val = normalize(searchInput.value);
  if(!val){ searchSugg.classList.remove('show'); searchSugg.innerHTML=''; return; }
  const matches = searchIndex.filter(item=>normalize(item.label).includes(val)).slice(0,10);
  searchSugg.innerHTML = matches.length
    ? matches.map(item=>`<div data-val="${item.label}"><span>${item.label}</span><span class="tag">${item.tag}</span></div>`).join('')
    : '<div class="no-match">Sin resultados</div>';
  searchSugg.classList.add('show');
}

// A medida que se escribe: se van rellenando/filtrando tanto las sugerencias como el catálogo
searchInput.addEventListener('input', ()=>{
  searchQuery = searchInput.value;
  renderSuggestions();
  applyFilters();
});
searchInput.addEventListener('focus', renderSuggestions);

searchSugg.addEventListener('click', e=>{
  const val = e.target.closest('[data-val]')?.dataset.val;
  if(!val) return;
  searchInput.value = val;
  searchQuery = val;
  searchSugg.classList.remove('show');
  applyFilters();
});

document.addEventListener('click', e=>{
  if(!e.target.closest('.search-field[data-field="all"]')){
    searchSugg.classList.remove('show');
  }
});

document.getElementById('clearFilters').addEventListener('click', ()=>{
  searchQuery = '';
  searchInput.value = '';
  searchSugg.classList.remove('show');
  searchSugg.innerHTML = '';
  applyFilters();
});

function addToCart(id, aroma){
  const key = id + '::' + aroma;
  if(!cart[key]) cart[key] = { id, aroma, qty: 0 };
  cart[key].qty++;
  renderCart();
}

function openDetailModal(id){
  const p = PRODUCTS.find(x=>x.id==id);
  if(!p) return;
  const aromaNames = (p.aromas||[]).map(a=> typeof a === 'string' ? a : a.nombre);
  const modal = document.getElementById('detailModal');
  modal.innerHTML = `
    <button class="close-x" id="closeDetailModal">✕</button>
    <div class="detail-img"><img src="${p.img}" alt="${p.name}"></div>
    <div class="detail-body">
      ${p.brand ? `<div class="marca">${p.brand}</div>` : ''}
      <h3>${p.name}</h3>
      <div class="price">${money(p.price)}</div>
      ${aromaNames.length ? `
        <select class="aroma-select" id="detailAromaSelect">
          ${aromaNames.map(n=>`<option value="${n}">${n}</option>`).join('')}
        </select>
      ` : ''}
      ${p.detail ? `<p class="desc">${formatDetail(p.detail)}</p>` : ''}
      <button class="addbtn" id="detailAddBtn">Agregar al pedido</button>
    </div>
  `;
  document.getElementById('detailModalBg').classList.add('show');
  document.getElementById('closeDetailModal').onclick = closeDetailModal;
  document.getElementById('detailAddBtn').onclick = e=>{
    const aromaSel = document.getElementById('detailAromaSelect');
    const aroma = aromaSel ? aromaSel.value : '';
    addToCart(p.id, aroma);
    e.target.textContent = 'Agregado ✓';
    e.target.classList.add('added');
    setTimeout(()=>{ e.target.textContent = 'Agregar al pedido'; e.target.classList.remove('added'); }, 900);
  };
}
function closeDetailModal(){
  document.getElementById('detailModalBg').classList.remove('show');
}
document.getElementById('detailModalBg').addEventListener('click', e=>{
  if(e.target.id === 'detailModalBg') closeDetailModal();
});

catalog.addEventListener('click', e=>{
  if(e.target.classList.contains('detail-btn')){
    openDetailModal(e.target.dataset.detailId);
    return;
  }
  if(e.target.classList.contains('addbtn')){
    const id = e.target.dataset.id;
    const card = e.target.closest('.card');
    const aromaSel = card.querySelector('.aroma-select');
    const aroma = aromaSel ? aromaSel.value : '';
    addToCart(id, aroma);
    e.target.textContent = 'Agregado ✓';
    e.target.classList.add('added');
    setTimeout(()=>{ e.target.textContent='Agregar'; e.target.classList.remove('added'); }, 900);
  }
});

function renderCart(){
  const keys = Object.keys(cart).filter(k=>cart[k].qty>0);
  const badge = document.getElementById('cartBadge');
  const totalQty = keys.reduce((s,k)=>s+cart[k].qty,0);
  badge.style.display = totalQty>0 ? 'flex' : 'none';
  badge.textContent = totalQty;

  const cartItems = document.getElementById('cartItems');
  const checkoutBtn = document.getElementById('checkoutBtn');
  if(keys.length===0){
    cartItems.innerHTML = '<div class="cart-empty">Todavía no agregaste productos.<br>Elegí algo del catálogo ✨</div>';
    checkoutBtn.disabled = true;
  } else {
    checkoutBtn.disabled = false;
    let total = 0;
    cartItems.innerHTML = keys.map(key=>{
      const entry = cart[key];
      const p = PRODUCTS.find(x=>x.id==entry.id);
      const sub = p.price*entry.qty;
      total += sub;
      return `
        <div class="cart-item">
          <img src="${p.img}">
          <div class="ci-info">
            <div class="ci-name">${p.name}</div>
            ${entry.aroma ? `<div class="ci-aroma">Aroma: ${entry.aroma}</div>` : ''}
            <div class="ci-price">${money(p.price)} c/u</div>
            <div class="qty">
              <button data-act="dec" data-key="${key}">-</button>
              <span>${entry.qty}</span>
              <button data-act="inc" data-key="${key}">+</button>
            </div>
            <button class="remove-btn" data-act="rm" data-key="${key}">Quitar</button>
          </div>
        </div>
      `;
    }).join('');
    document.getElementById('cartTotal').textContent = money(total);
  }
}

document.getElementById('cartItems').addEventListener('click', e=>{
  const act = e.target.dataset.act;
  const key = e.target.dataset.key;
  if(!act) return;
  if(act==='inc') cart[key].qty++;
  if(act==='dec') { cart[key].qty--; if(cart[key].qty<=0) delete cart[key]; }
  if(act==='rm') delete cart[key];
  renderCart();
});

const cartDrawer = document.getElementById('cartDrawer');
const overlay = document.getElementById('overlay');
document.getElementById('cartFab').onclick = ()=>{ cartDrawer.classList.add('open'); overlay.classList.add('show'); };
document.getElementById('closeCart').onclick = ()=>{ cartDrawer.classList.remove('open'); overlay.classList.remove('show'); };
overlay.onclick = ()=>{ cartDrawer.classList.remove('open'); overlay.classList.remove('show'); document.getElementById('modalBg').classList.remove('show'); };

const modalBg = document.getElementById('modalBg');
document.getElementById('checkoutBtn').onclick = ()=> modalBg.classList.add('show');
document.getElementById('closeModal').onclick = ()=> modalBg.classList.remove('show');

document.getElementById('sendBtn').onclick = ()=>{
  const name = document.getElementById('custName').value.trim() || 'Cliente';
  const phone = document.getElementById('custPhone').value.trim();
  const vendedor = document.getElementById('vendedor').value;
  const keys = Object.keys(cart).filter(k=>cart[k].qty>0);
  if(keys.length===0) return;

  let total = 0;
  const detalleItems = [];

  // Build WhatsApp text
  let msg = `Hola! Soy ${name} 🙋 Quiero hacer este pedido del catálogo:%0A%0A`;
  keys.forEach(key=>{
    const entry = cart[key];
    const p = PRODUCTS.find(x=>x.id==entry.id);
    const sub = p.price*entry.qty; total += sub;
    const nameWithBrand = p.brand ? `${p.brand} - ${p.name}` : p.name;
    const fullName = entry.aroma ? `${nameWithBrand} (${entry.aroma})` : nameWithBrand;
    msg += `• ${fullName} x${entry.qty} - $${sub.toLocaleString('es-AR')}%0A`;
    detalleItems.push(`${fullName} x${entry.qty} (${money(p.price)} c/u)`);
  });
  msg += `%0A*Total: $${total.toLocaleString('es-AR')}*`;

  // Descontar stock automático y guardar el pedido, si está configurado (no bloquea el envío por WhatsApp)
  if (typeof STOCK_API_URL !== 'undefined' && STOCK_API_URL) {
    const items = keys.map(key=>{
      const entry = cart[key];
      const p = PRODUCTS.find(x=>x.id==entry.id);
      const itemId = entry.aroma ? `${p.id}::${entry.aroma}` : p.id;
      return { id: itemId, cantidad: entry.qty };
    });
    sendToSheet({ action: 'decrement', items: JSON.stringify(items) });

    sendToSheet({
      action: 'pedido',
      nombre: name,
      telefono: phone,
      pedido: detalleItems.join(', '),
      total: total
    });
  }

  window.open(`https://wa.me/${vendedor}?text=${msg}`, '_blank');
  modalBg.classList.remove('show');
};
